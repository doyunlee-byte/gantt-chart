setTimeout(function(){ pgComputeAxis(); pgRenderAxis(); pgRenderRows(); }, 80);
</script>
<script>
// ── Project Dashboard (매장별 프로그램 배포 현황) — 사이드바 3뷰: 통합 대시보드 / 센터 일정 / 이슈 히스토리
const DEPLOY_STATUSES = ['대기중', '배포중', '완료', '실패'];
const DEPLOY_STATUS_BADGE = { '대기중': 'badge-muted', '배포중': 'badge-amber', '완료': 'badge-green', '실패': 'badge-red' };
const DEPLOY_STATUS_COLOR = { '대기중': 'var(--text3)', '배포중': 'var(--amber)', '완료': 'var(--green)', '실패': 'var(--red)' };
const SCHEDULE_STATUS_BADGE = { '예정': 'badge-muted', '진행중': 'badge-amber', '완료': 'badge-green', '지연': 'badge-red', '설치가능': 'badge-accent', '취소됨': 'badge-muted' };
const DEPLOY_AVATAR_COLOR_KEYS = ['blue', 'teal', 'amber', 'purple', 'teal2'];
const DEPLOY_AVATAR_COLOR_MAP = {
  blue:   { bg: 'var(--blue-avatar)',   text: 'var(--blue-text)' },
  teal:   { bg: 'var(--teal-avatar)',   text: 'var(--teal-text)' },
  teal2:  { bg: 'var(--teal2-avatar)',  text: 'var(--teal2-text)' },
  amber:  { bg: 'var(--amber-avatar)',  text: 'var(--amber-text)' },
  purple: { bg: 'var(--purple-avatar)', text: 'var(--purple-text)' },
};
function avatarColorFor(i) { return DEPLOY_AVATAR_COLOR_MAP[DEPLOY_AVATAR_COLOR_KEYS[i % DEPLOY_AVATAR_COLOR_KEYS.length]]; }
function formatDeployDateTime(d) {
  const mo = d.getMonth() + 1, da = d.getDate();
  const hh = String(d.getHours()).padStart(2, '0'), mi = String(d.getMinutes()).padStart(2, '0');
  return `${mo}/${da} ${hh}:${mi}`;
}
function formatDeployDay(d) { return `${d.getMonth() + 1}/${d.getDate()}`; }

// ── 사이드바 뷰 전환 (switchPage와 동일 패턴: display 토글 + active 토글 + lazy load) ──
let deployCurrentView = 'overview';
function switchDeployView(view) {
  deployCurrentView = view;
  document.getElementById('pdViewOverview').style.display = view === 'overview' ? 'block' : 'none';
  document.getElementById('pdViewSchedule').style.display = view === 'schedule' ? 'block' : 'none';
  document.getElementById('pdViewIssues').style.display = view === 'issues' ? 'block' : 'none';
  document.getElementById('pdMenuOverview').classList.toggle('active', view === 'overview');
  document.getElementById('pdMenuSchedule').classList.toggle('active', view === 'schedule');
  document.getElementById('pdMenuIssues').classList.toggle('active', view === 'issues');
  if (view === 'overview') { deployOverviewLoaded ? renderDeployOverview() : loadDeployOverview(); }
  if (view === 'schedule') { deployScheduleLoaded ? setScheduleSubtab(pdScheduleSubtab) : loadDeploySchedule(); }
  if (view === 'issues') { deployIssuesLoaded ? renderDeployIssues() : loadDeployIssues(); }
}
function enterDeployPage() { switchDeployView(deployCurrentView); }

// ═══════════════════════════════════════════════════════════════
// 1) 통합 대시보드
// ═══════════════════════════════════════════════════════════════
let deployStores = [];
let deployOverviewLoaded = false;

// mock 데이터 생성 — 내부 시스템 API 연동 전 임시 데이터 (매장 14개, 상태 골고루 섞음)
function generateMockStoreDeployments() {
  const storeNames = ['강남점', '홍대점', '신촌점', '잠실점', '수원점', '대구점', '부산서면점', '광주점', '대전점', '인천점', '청주점', '전주점', '울산점', '창원점'];
  const owners = ['김도윤', '이수민', '박지훈', '최유진', '정하은'];
  const now = Date.now();
  return storeNames.map((name, i) => ({
    id: `store-${i + 1}`,
    storeName: name,
    status: DEPLOY_STATUSES[i % DEPLOY_STATUSES.length],
    owner: owners[i % owners.length],
    updatedAt: new Date(now - Math.floor(Math.random() * 72) * 3600000),
  }));
}

// 실제 내부 시스템 API 연동 시 이 함수 내부만 교체하면 됩니다.
// 예: const res = await fetch('/api/deployments'); return await res.json();
async function fetchStoreDeploymentStatus() {
  return generateMockStoreDeployments();
}

async function loadDeployOverview() {
  const el = document.getElementById('pdKpiRow');
  if (el) el.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text3);font-size:13px;">📊 불러오는 중...</div>`;
  try {
    deployStores = await fetchStoreDeploymentStatus();
    deployOverviewLoaded = true;
    renderDeployOverview();
  } catch (e) {
    console.error('[Deploy] fetchStoreDeploymentStatus 에러:', e);
    if (el) el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>데이터를 불러올 수 없습니다.</p></div>`;
  }
}

function renderDeployOverview() {
  renderPdKpis();
  renderPdDonut();
  renderPdOwnerBar();
  renderPdRecentList();
}

function renderPdKpis() {
  const el = document.getElementById('pdKpiRow');
  if (!el) return;
  const cards = [
    { icon: '🏬', label: '전체 매장', value: deployStores.length, bg: 'var(--purple-bg)', fg: 'var(--purple-text)' },
    { icon: '✅', label: '배포 완료', value: deployStores.filter(s => s.status === '완료').length, bg: 'var(--teal-bg)', fg: 'var(--teal-text)' },
    { icon: '🚚', label: '배포중', value: deployStores.filter(s => s.status === '배포중').length, bg: 'var(--amber-bg)', fg: 'var(--amber-text)' },
    { icon: '⛔', label: '실패', value: deployStores.filter(s => s.status === '실패').length, bg: 'var(--red-bg)', fg: 'var(--red-text)' },
  ];
  el.innerHTML = cards.map(c => `
    <div class="pd-kpi-card">
      <div class="pd-kpi-icon" style="background:${c.bg};color:${c.fg};">${c.icon}</div>
      <div>
        <div class="pd-kpi-value">${c.value}</div>
        <div class="pd-kpi-label">${c.label}</div>
      </div>
    </div>`).join('');
}

function renderPdDonut() {
  const el = document.getElementById('pdDonutWrap');
  if (!el) return;
  const total = deployStores.length || 1;
  const segs = DEPLOY_STATUSES.map(s => ({ status: s, count: deployStores.filter(x => x.status === s).length, color: DEPLOY_STATUS_COLOR[s] }));
  const R = 46, C = 2 * Math.PI * R;
  let offset = 0;
  const circles = segs.filter(s => s.count > 0).map(seg => {
    const len = (seg.count / total) * C;
    const rotate = (offset / C) * 360;
    offset += len;
    return `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${seg.color}" stroke-width="16" stroke-dasharray="${len} ${C - len}" transform="rotate(${rotate} 60 60)" />`;
  }).join('');
  el.innerHTML = `
    <svg width="120" height="120" viewBox="0 0 120 120" style="flex-shrink:0;transform:rotate(-90deg);">
      ${circles || `<circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--surface2)" stroke-width="16" />`}
    </svg>
    <div class="pd-donut-legend">
      ${segs.map(seg => `
        <div class="pd-donut-legend-row">
          <span class="pd-donut-legend-dot" style="background:${seg.color}"></span>
          <span>${seg.status}</span>
          <span class="pd-donut-legend-val">${seg.count}</span>
        </div>`).join('')}
    </div>`;
}

function renderPdOwnerBar() {
  const el = document.getElementById('pdBarWrap');
  if (!el) return;
  const counts = {};
  deployStores.forEach(s => { counts[s.owner] = (counts[s.owner] || 0) + 1; });
  const owners = Object.keys(counts);
  const max = Math.max(1, ...Object.values(counts));
  if (!owners.length) { el.innerHTML = `<div class="empty-state"><p>데이터가 없습니다.</p></div>`; return; }
  el.innerHTML = owners.map(o => {
    const v = counts[o];
    return `<div class="pd-bar-row">
      <span class="pd-bar-label">${o}</span>
      <div class="pd-bar-track"><div class="pd-bar-fill" style="width:${(v / max * 100).toFixed(0)}%"></div></div>
      <span class="pd-bar-val">${v}</span>
    </div>`;
  }).join('');
}

function renderPdRecentList() {
  const el = document.getElementById('pdRecentList');
  if (!el) return;
  const sorted = [...deployStores].sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 8);
  if (!sorted.length) { el.innerHTML = `<div class="empty-state"><p>데이터가 없습니다.</p></div>`; return; }
  el.innerHTML = sorted.map((s, i) => {
    const badgeClass = DEPLOY_STATUS_BADGE[s.status] || 'badge-muted';
    const c = avatarColorFor(i);
    return `<div class="pd-store-row">
      <span class="pd-store-name">${s.storeName}</span>
      <span class="metric-badge ${badgeClass}" style="margin-top:0;">${s.status}</span>
      <span class="pd-store-owner"><span class="avatar" style="background:${c.bg};color:${c.text}">${s.owner.charAt(0)}</span>${s.owner}</span>
      <span class="pd-store-time">${formatDeployDateTime(s.updatedAt)}</span>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════
// 2) 전체일정 — 캘린더 / 매장분포, 취소 시 대체 매장 추천
// ═══════════════════════════════════════════════════════════════
let deploySchedules = [];
let deployScheduleLoaded = false;
let pdScheduleSubtab = 'calendar';
let pdCalYear = null, pdCalMonth = null, pdCalSelectedDate = null;
let pdDistSelectedStoreId = null;
const SCHEDULE_STATUS_COLOR = { '예정': 'var(--text3)', '진행중': 'var(--amber)', '완료': 'var(--green)', '지연': 'var(--red)', '설치가능': 'var(--accent)', '취소됨': 'var(--text3)' };

// mock 데이터 생성 — 매장별 지역/좌표/담당자/설치시간 포함 예정 일정 (13건)
// x,y는 실좌표 연동 전까지 쓰는 임의 평면 좌표(지역별로 뭉쳐 배치해 근접도 계산에 사용)
function generateMockCenterSchedules() {
  const STORE_GEO = {
    '강남점':     { region: '서울권', x: 152, y: 78 },
    '홍대점':     { region: '서울권', x: 130, y: 64 },
    '신촌점':     { region: '서울권', x: 126, y: 70 },
    '잠실점':     { region: '서울권', x: 170, y: 82 },
    '수원점':     { region: '경기권', x: 138, y: 100 },
    '인천점':     { region: '경기권', x: 98, y: 78 },
    '청주점':     { region: '충청권', x: 168, y: 138 },
    '대전점':     { region: '충청권', x: 176, y: 150 },
    '대구점':     { region: '경상권', x: 258, y: 168 },
    '울산점':     { region: '경상권', x: 292, y: 192 },
    '부산서면점': { region: '경상권', x: 280, y: 220 },
    '광주점':     { region: '전라권', x: 148, y: 208 },
    '전주점':     { region: '전라권', x: 164, y: 178 },
  };
  const owners = ['김도윤', '이수민', '박지훈', '최유진', '정하은'];
  const times = ['09:00', '10:30', '13:00', '14:30', '16:00'];
  const statuses = ['예정', '진행중', '완료', '지연', '설치가능', '설치가능'];
  const now = Date.now();
  return Object.keys(STORE_GEO).map((name, i) => {
    const geo = STORE_GEO[name];
    return {
      id: `sched-${i + 1}`,
      storeName: name,
      region: geo.region,
      x: geo.x,
      y: geo.y,
      owner: owners[i % owners.length],
      installDate: new Date(now + (i - 4) * 86400000 * 2),
      installTime: times[i % times.length],
      status: statuses[i % statuses.length],
    };
  });
}

// 실제 내부 시스템 API 연동 시 이 함수 내부만 교체하면 됩니다.
async function fetchCenterSchedules() {
  return generateMockCenterSchedules();
}

async function loadDeploySchedule() {
  const el = document.getElementById('pdCalGrid');
  if (el) el.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--text3);font-size:13px;">🗓️ 일정 불러오는 중...</div>`;
  try {
    deploySchedules = await fetchCenterSchedules();
    deployScheduleLoaded = true;
    const today = new Date();
    pdCalYear = today.getFullYear();
    pdCalMonth = today.getMonth();
    setScheduleSubtab(pdScheduleSubtab);
  } catch (e) {
    console.error('[Deploy] fetchCenterSchedules 에러:', e);
    if (el) el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><p>일정을 불러올 수 없습니다.</p></div>`;
  }
}

// ── 서브탭 전환 ──
function setScheduleSubtab(tab) {
  pdScheduleSubtab = tab;
  document.getElementById('pdCalendarView').style.display = tab === 'calendar' ? 'block' : 'none';
  document.getElementById('pdDistributionView').style.display = tab === 'distribution' ? 'block' : 'none';
  document.getElementById('pdSubtabCalendar').classList.toggle('active', tab === 'calendar');
  document.getElementById('pdSubtabDistribution').classList.toggle('active', tab === 'distribution');
  if (tab === 'calendar') renderPdCalendar();
  if (tab === 'distribution') renderPdDistribution();
}

// ── 일정 상세 아이템 (캘린더/매장분포 공통) ──
function pdDateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

function renderScheduleDetailItem(s, recoWrapId) {
  const badgeClass = SCHEDULE_STATUS_BADGE[s.status] || 'badge-muted';
  const cancelable = s.status !== '완료' && s.status !== '취소됨';
  return `<div class="pd-cal-detail-item">
    <div class="pd-cal-detail-store">${s.storeName}</div>
    <div class="pd-cal-detail-meta">담당 ${s.owner} · ${s.installTime} · <span class="metric-badge ${badgeClass}" style="margin-top:0;">${s.status}</span></div>
    ${cancelable ? `<button class="pd-cancel-btn" onclick="handleCancelSchedule('${s.id}','${recoWrapId}')">취소</button>` : ''}
  </div>`;
}

// ── 취소 → 대체 매장 추천 ──
function pdCalcDistanceKm(a, b) {
  const raw = Math.hypot(a.x - b.x, a.y - b.y);
  return Math.max(1, Math.round(raw * 0.6));
}

function pdBuildReplacementReasons(canceled, candidate, km) {
  const reasons = [`취소 매장에서 약 ${km}km 거리 (차량 이동 약 ${Math.round(km * 1.3)}분)`, '설치 가능 상태'];
  if (candidate.owner === canceled.owner) reasons.push('동일 담당자 배정 가능');
  if (candidate.region === canceled.region) reasons.push(`동일 권역(${candidate.region})`);
  return reasons;
}

function pdComputeReplacementCandidates(canceledStoreId) {
  const canceled = deploySchedules.find(s => s.id === canceledStoreId);
  if (!canceled) return [];
  const pool = deploySchedules.filter(s => s.id !== canceledStoreId && s.status === '설치가능');
  return pool
    .map(s => ({ ...s, distanceKm: pdCalcDistanceKm(canceled, s) }))
    .sort((a, b) => a.distanceKm - b.distanceKm)
    .slice(0, 3)
    .map(s => ({ ...s, reasons: pdBuildReplacementReasons(canceled, s, s.distanceKm) }));
}

// 실제 내부 시스템 API/좌표 연동 시 이 함수 내부만 교체하면 됩니다.
async function fetchNearbyReplacementCandidates(canceledStoreId) {
  return pdComputeReplacementCandidates(canceledStoreId);
}

async function handleCancelSchedule(id, recoWrapId) {
  const item = deploySchedules.find(s => s.id === id);
  if (!item) return;
  item.status = '취소됨';
  if (pdScheduleSubtab === 'calendar') { renderPdCalendar(); } else { renderPdDistSvg(); renderPdDistRegionCards(); renderPdDistDetail(); }
  const loadingEl = document.getElementById(recoWrapId);
  if (loadingEl) loadingEl.innerHTML = `<div class="pd-reco-wrap"><div class="pd-reco-title">⏳ ${item.owner} 담당자 일정에 빈 시간 발생 · 대체 매장 탐색 중...</div></div>`;
  try {
    const candidates = await fetchNearbyReplacementCandidates(id);
    renderReplacementCandidates(item, candidates, recoWrapId);
  } catch (e) {
    console.error('[Deploy] fetchNearbyReplacementCandidates 에러:', e);
    const el = document.getElementById(recoWrapId);
    if (el) el.innerHTML = `<div class="pd-reco-wrap"><div class="pd-reco-title">대체 매장을 찾을 수 없습니다.</div></div>`;
  }
}

function renderReplacementCandidates(canceledItem, candidates, recoWrapId) {
  const el = document.getElementById(recoWrapId);
  if (!el) return;
  if (!candidates.length) {
    el.innerHTML = `<div class="pd-reco-wrap"><div class="pd-reco-title">⏳ ${canceledItem.owner} 담당자 일정에 빈 시간 발생</div><div class="empty-state"><p>인근에 설치 가능한 대체 매장이 없습니다.</p></div></div>`;
    return;
  }
  el.innerHTML = `<div class="pd-reco-wrap">
    <div class="pd-reco-title">⏳ ${canceledItem.owner} 담당자 일정에 빈 시간 발생 · 대체 매장 추천 ${candidates.length}건</div>
    ${candidates.map(c => `
      <div class="pd-reco-card">
        <div class="pd-reco-store">${c.storeName} <span style="color:var(--text3);font-weight:500;font-size:10.5px;">(${c.region})</span></div>
        <div class="pd-reco-reason">${c.reasons.map(r => `· ${r}`).join('<br>')}</div>
        <button class="pd-reco-assign-btn" onclick="assignReplacement('${canceledItem.id}','${c.id}','${recoWrapId}')">이 매장으로 대체</button>
      </div>`).join('')}
  </div>`;
}

function assignReplacement(canceledId, candidateId, recoWrapId) {
  const canceled = deploySchedules.find(s => s.id === canceledId);
  const candidate = deploySchedules.find(s => s.id === candidateId);
  if (!canceled || !candidate) return;
  candidate.status = '예정';
  candidate.installDate = canceled.installDate;
  candidate.installTime = canceled.installTime;
  candidate.owner = canceled.owner;
  if (pdScheduleSubtab === 'calendar') { renderPdCalendar(); } else { renderPdDistSvg(); renderPdDistRegionCards(); renderPdDistDetail(); }
  const el = document.getElementById(recoWrapId);
  if (el) el.innerHTML = `<div class="pd-reco-wrap"><div class="pd-reco-title" style="color:var(--green);">✅ ${candidate.storeName} 매장으로 대체 배정 완료</div></div>`;
}

// ── 캘린더 서브뷰 ──
function pdCalShiftMonth(delta) {
  pdCalMonth += delta;
  if (pdCalMonth < 0) { pdCalMonth = 11; pdCalYear--; }
  if (pdCalMonth > 11) { pdCalMonth = 0; pdCalYear++; }
  pdCalSelectedDate = null;
  renderPdCalendar();
}

function pdCalSelectDate(key) {
  pdCalSelectedDate = key;
  renderPdCalendar();
}

function renderPdCalendar() {
  const monthLabelEl = document.getElementById('pdCalMonthLabel');
  if (monthLabelEl) monthLabelEl.textContent = `${pdCalYear}년 ${pdCalMonth + 1}월`;
  const dowRow = document.getElementById('pdCalDowRow');
  if (dowRow && !dowRow.childElementCount) {
    dowRow.innerHTML = ['일', '월', '화', '수', '목', '금', '토'].map(d => `<div class="pd-cal-dow">${d}</div>`).join('');
  }
  const byDate = {};
  deploySchedules.forEach(s => { (byDate[pdDateKey(s.installDate)] = byDate[pdDateKey(s.installDate)] || []).push(s); });
  const first = new Date(pdCalYear, pdCalMonth, 1);
  const gridStart = new Date(pdCalYear, pdCalMonth, 1 - first.getDay());
  const todayKey = pdDateKey(new Date());
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    const key = pdDateKey(d);
    const items = byDate[key] || [];
    const isOutside = d.getMonth() !== pdCalMonth;
    const shown = items.slice(0, 2);
    const extra = items.length - shown.length;
    cells.push(`<div class="pd-cal-cell${isOutside ? ' is-outside' : ''}${key === todayKey ? ' is-today' : ''}${key === pdCalSelectedDate ? ' is-selected' : ''}" onclick="pdCalSelectDate('${key}')">
      <div class="pd-cal-daynum">${d.getDate()}</div>
      ${shown.map(s => `<div class="pd-cal-badge" style="background:${SCHEDULE_STATUS_COLOR[s.status] || 'var(--text3)'}">${s.storeName}</div>`).join('')}
      ${extra > 0 ? `<div class="pd-cal-more">+${extra}건</div>` : ''}
    </div>`);
  }
  document.getElementById('pdCalGrid').innerHTML = cells.join('');
  renderPdCalDetail();
}

function renderPdCalDetail() {
  const el = document.getElementById('pdCalDetail');
  if (!el) return;
  if (!pdCalSelectedDate) { el.innerHTML = `<div class="empty-state"><p>날짜를 선택하면<br>상세 일정을 볼 수 있어요.</p></div>`; return; }
  const items = deploySchedules.filter(s => pdDateKey(s.installDate) === pdCalSelectedDate);
  const [y, m, d] = pdCalSelectedDate.split('-');
  let html = `<div class="pd-cal-detail-date">${y}년 ${Number(m)}월 ${Number(d)}일</div>`;
  html += items.length ? items.map(s => renderScheduleDetailItem(s, 'pdCalRecoWrap')).join('') : `<div class="empty-state"><p>예정된 일정이 없습니다.</p></div>`;
  html += `<div id="pdCalRecoWrap"></div>`;
  el.innerHTML = html;
}

// ── 매장분포 서브뷰 ──
function renderPdDistribution() {
  renderPdDistSvg();
  renderPdDistRegionCards();
  renderPdDistDetail();
}

function renderPdDistSvg() {
  const el = document.getElementById('pdDistSvg');
  if (!el) return;
  el.innerHTML = deploySchedules.map(s => {
    const color = SCHEDULE_STATUS_COLOR[s.status] || 'var(--text3)';
    const sel = s.id === pdDistSelectedStoreId;
    return `<g onclick="pdDistSelectStore('${s.id}')" style="cursor:pointer;">
      <circle cx="${s.x}" cy="${s.y}" r="${sel ? 9 : 6}" fill="${color}" stroke="${sel ? 'var(--accent)' : '#fff'}" stroke-width="${sel ? 2.5 : 1.5}" />
      <text x="${s.x}" y="${s.y - 10}" font-size="8" text-anchor="middle" fill="var(--text2)">${s.storeName}</text>
    </g>`;
  }).join('');
}

function pdDistSelectStore(id) {
  pdDistSelectedStoreId = id;
  renderPdDistSvg();
  renderPdDistDetail();
}

function renderPdDistRegionCards() {
  const el = document.getElementById('pdDistRegions');
  if (!el) return;
  const regions = {};
  deploySchedules.forEach(s => { (regions[s.region] = regions[s.region] || []).push(s); });
  el.innerHTML = Object.keys(regions).map(r => {
    const items = regions[r];
    const statusCounts = {};
    items.forEach(s => { statusCounts[s.status] = (statusCounts[s.status] || 0) + 1; });
    return `<div class="pd-region-card">
      <div class="pd-region-name">${r}</div>
      <div class="pd-region-count">매장 ${items.length}개</div>
      <div class="pd-region-breakdown">${Object.keys(statusCounts).map(st =>
        `<span class="metric-badge ${SCHEDULE_STATUS_BADGE[st] || 'badge-muted'}" style="margin-top:0;">${st} ${statusCounts[st]}</span>`
      ).join('')}</div>
    </div>`;
  }).join('');
}

function renderPdDistDetail() {
  const el = document.getElementById('pdDistDetail');
  if (!el) return;
  if (!pdDistSelectedStoreId) { el.innerHTML = `<div class="empty-state"><p>지도에서 매장을 선택하면 상세정보를 볼 수 있어요.</p></div>`; return; }
  const s = deploySchedules.find(x => x.id === pdDistSelectedStoreId);
  if (!s) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="pd-cal-detail-date">${s.storeName} <span style="color:var(--text3);font-weight:500;font-size:11px;">(${s.region})</span></div>` +
    renderScheduleDetailItem(s, 'pdDistRecoWrap') +
    `<div id="pdDistRecoWrap"></div>`;
}

// ═══════════════════════════════════════════════════════════════
// 3) 이슈 히스토리
// ═══════════════════════════════════════════════════════════════
let deployIssues = [];
let deployIssuesLoaded = false;
let deployIssueFilter = '전체';

// mock 데이터 생성 — 매장 배포 이슈 로그 (9건)
function generateMockIssueHistory() {
  const issues = [
    { storeName: '강남점', desc: 'POS 단말기 배포 스크립트 실행 중 네트워크 타임아웃 발생' },
    { storeName: '홍대점', desc: '설치 프로그램 버전 불일치로 재배포 필요' },
    { storeName: '신촌점', desc: '매장 내부 방화벽 정책으로 원격 업데이트 차단' },
    { storeName: '잠실점', desc: '배포 후 결제 모듈 인증 오류 발생' },
    { storeName: '대구점', desc: '설치 담당자 일정 변경으로 방문 지연' },
    { storeName: '부산서면점', desc: '기존 버전 데이터 마이그레이션 실패' },
    { storeName: '대전점', desc: '매장 전산 교체로 하드웨어 사양 재확인 필요' },
    { storeName: '인천점', desc: '배포 서버 응답 지연으로 설치 중단' },
    { storeName: '전주점', desc: '태블릿 펌웨어 업데이트 후 앱 크래시 발생' },
  ];
  const owners = ['김도윤', '이수민', '박지훈', '최유진', '정하은'];
  const now = Date.now();
  return issues.map((it, i) => ({
    id: `issue-${i + 1}`,
    storeName: it.storeName,
    desc: it.desc,
    occurredAt: new Date(now - (i + 1) * 86400000 * 1.6),
    resolveStatus: i % 3 === 2 ? '진행중' : '해결됨',
    owner: owners[i % owners.length],
  }));
}

// 실제 내부 시스템 API 연동 시 이 함수 내부만 교체하면 됩니다.
async function fetchIssueHistory() {
  return generateMockIssueHistory();
}

async function loadDeployIssues() {
  const el = document.getElementById('pdIssueList');
  if (el) el.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--text3);font-size:13px;">⚠️ 이슈 불러오는 중...</div>`;
  try {
    deployIssues = await fetchIssueHistory();
    deployIssuesLoaded = true;
    renderDeployIssues();
  } catch (e) {
    console.error('[Deploy] fetchIssueHistory 에러:', e);
    if (el) el.innerHTML = `<div class="empty-state"><p>이슈 내역을 불러올 수 없습니다.</p></div>`;
  }
}

function setDeployIssueFilter(status) { deployIssueFilter = status; renderDeployIssues(); }

function renderDeployIssueFilterBar() {
  const el = document.getElementById('pdIssueFilterBar');
  if (!el) return;
  const options = ['전체', '진행중', '해결됨'];
  el.innerHTML = `<span class="board-filter-label">상태</span>` + options.map(o =>
    `<button class="pd-filter-chip${deployIssueFilter === o ? ' active' : ''}" onclick="setDeployIssueFilter('${o}')">${o}</button>`
  ).join('');
}

function renderDeployIssues() {
  renderDeployIssueFilterBar();
  const el = document.getElementById('pdIssueList');
  if (!el) return;
  const filtered = deployIssueFilter === '전체' ? deployIssues : deployIssues.filter(i => i.resolveStatus === deployIssueFilter);
  if (!filtered.length) { el.innerHTML = `<div class="empty-state"><p>해당 이슈가 없습니다.</p></div>`; return; }
  const sorted = [...filtered].sort((a, b) => b.occurredAt - a.occurredAt);
  el.innerHTML = sorted.map((it, i) => {
    const badge = it.resolveStatus === '해결됨' ? 'badge-green' : 'badge-amber';
    const c = avatarColorFor(i);
    return `<div class="pd-issue-card">
      <div class="pd-issue-top">
        <span class="pd-issue-store">${it.storeName}</span>
        <span class="metric-badge ${badge}" style="margin-top:0;">${it.resolveStatus}</span>
        <span class="pd-issue-date">${formatDeployDay(it.occurredAt)}</span>
      </div>
      <div class="pd-issue-desc">${it.desc}</div>
      <div class="pd-issue-bottom">
        <span class="pd-issue-owner"><span class="avatar" style="width:16px;height:16px;font-size:7px;background:${c.bg};color:${c.text}">${it.owner.charAt(0)}</span>담당: ${it.owner}</span>
      </div>
    </div>`;
  }).join('');
}

</script>
